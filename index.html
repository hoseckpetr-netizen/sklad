<style>
:root{--accent:#00FFFF;--bg:#0b0d10;--card:#1a1e23;--card2:#14181d;--border:#262b31;--text:#eef1f3;--muted:#9aa2ab;--green:#34D399;--red:#f87171;--amber:#fbbf24;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + 48px + max(env(safe-area-inset-bottom),14px))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,13,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}

header.top .t{font-weight:600;font-size:15px;line-height:1.15}
header.top .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
header.top .sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{transform:scale(.95)}
.ibtn.spin svg{animation:sp 1s linear infinite}

main{padding:14px 16px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:#12161b;border:0;box-shadow:none;outline:0;padding-bottom:max(env(safe-area-inset-bottom),18px)}
nav.bottom .in{display:flex;width:100%;max-width:760px}
nav.bottom button{flex:1;height:var(--nav);background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;line-height:1.2;cursor:pointer;position:relative;overflow:visible}
nav.bottom button.on{color:var(--accent)}
nav.bottom button:focus,nav.bottom button:focus-visible,nav.bottom button:active{outline:0;box-shadow:none}
nav.bottom button svg{width:22px;height:22px}
nav.bottom .dot{position:absolute;top:9px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:600}

.search input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0}

.chip{flex-shrink:0;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(0,255,255,.1)}

.ord{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}

table.t{width:100%;border-collapse:collapse;font-size:14px}

.pos{color:var(--green)}.neg{color:var(--red)}.wr{color:var(--amber)}

.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.tg .l{font-weight:500}.tg .l small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#2a3038;border:0;cursor:pointer;flex-shrink:0;transition:.15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:25px;background:#04201f}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
#toastHost{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 28px + max(env(safe-area-inset-bottom),14px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#222831;border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:up .2s;max-width:520px}
.toast.err{border-color:var(--red);color:#fecaca}.toast.ok{border-color:rgba(52,211,153,.5)}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.login img{width:96px}.login .err{color:var(--red);font-size:13px;max-width:320px}
.sect{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.mini{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.kv:first-child{border-top:0}
.minigrid{display:grid;grid-template-columns:70px repeat(3,1fr);gap:6px;align-items:center;margin-bottom:4px}
.minigrid .in{height:38px;padding:0 8px;text-align:center}
@media(min-width:760px){main{padding:18px 0}header.top{padding-left:max(16px,calc(50vw - 380px))}}
</style>

/* ================================ UTIL =================================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function num(v){ var n = parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function truthy(v){ return v===true || String(v).toUpperCase()==='TRUE' || String(v)==='1'; }
function fmtDT(iso){ if(!iso) return ''; var d = new Date(iso); if (isNaN(d)) return String(iso); return d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtD(iso){ if(!iso) return ''; var d = new Date(iso); if (isNaN(d)) return String(iso); return d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear(); }
function kc(n){ return (num(n)).toLocaleString('cs-CZ')+' Kč'; }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function gfetch(url, opts){
  opts = opts || {}; opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
  return fetch(url, opts).then(function(r){
    if (r.status === 401) { var e = new Error('Přihlášení vypršelo'); e.auth = true; throw e; }
    if (!r.ok) return r.json().catch(function(){return {};}).then(function(j){ throw new Error((j.error && j.error.message) || ('HTTP ' + r.status)); });
    return r.json();
  });
}

function toObjs(tab, rows){
  var cols = SCHEMA[tab], out = [];
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i] || [], o = { _row: i + 1 }, any = false;
    for (var c = 0; c < cols.length; c++) { o[cols[c]] = r[c] === undefined ? '' : r[c]; if (r[c] !== undefined && r[c] !== '') any = true; }
    if (any) out.push(o);
  }
  return out;
}
function toRow(tab, o){ return SCHEMA[tab].map(function(c){ var v = o[c]; return v === undefined || v === null ? '' : v; }); }

function buildModel(raw){
  M.orders = toObjs('Objednavky', raw.Objednavky || []);
  M.items = toObjs('Polozky', raw.Polozky || []);
  M.moves = toObjs('Pohyby', raw.Pohyby || []);
  M.catalog = toObjs('Katalog', raw.Katalog || []);
  M.minRows = toObjs('Minima', raw.Minima || []);
  M.emailRows = toObjs('Emaily', raw.Emaily || []);
  M.settingRows = toObjs('Nastaveni', raw.Nastaveni || []);
  M.cats = toObjs('Kategorie', raw.Kategorie || []).map(function(c){ return c.nazev; });
  M.sets = {}; toObjs('Sety', raw.Sety || []).forEach(function(s){ (M.sets[s.set] = M.sets[s.set] || []).push({ item: s.item, ks: num(s.ks) || 1 }); });
  M.settings = {}; M.settingRows.forEach(function(s){ M.settings[s.klic] = String(s.hodnota); });
  M.min = {}; M.minRows.forEach(function(r){ ALLSIZES.forEach(function(sz){ M.min[r.item + '|' + sz] = num(r[sz]); }); });
  M.emails = {}; M.emailRows.forEach(function(e){ M.emails[e.klic] = e; });
  // stav skladu
  M.stock = {}; M.moves.forEach(function(m){ var k = m.item + '|' + m.velikost; M.stock[k] = (M.stock[k] || 0) + num(m.ks); });
  // položky podle objednávek
  M.itemsBy = {}; M.items.forEach(function(it){ it.ks = num(it.ks); it.vydano_ks = num(it.vydano_ks); (M.itemsBy[it.order_id] = M.itemsBy[it.order_id] || []).push(it); });
  M.orders.forEach(function(o){ o.kisB = truthy(o.kis); o.kzB = truthy(o.kis_zadano) || o.kisB; o.prB = truthy(o.pripraveno); o.vyB = truthy(o.vydano); o.items = M.itemsBy[o.id] || []; });
  // rezervace (FIFO podle data objednávky)
  M.reserved = {}; var cum = {};
  var open = M.orders.filter(isOpen).sort(function(a,b){ return String(a.cas) < String(b.cas) ? -1 : 1; });
  open.forEach(function(o){
    o.items.forEach(function(it){
      it._short = false; it._nosize = false;
      var rem = it.ks - it.vydano_ks; if (rem <= 0) return;
      if (!validSize(it.item, it.velikost)) { it._nosize = true; return; }
      var k = it.item + '|' + it.velikost; cum[k] = (cum[k] || 0) + rem; M.reserved[k] = cum[k];
      it._short = cum[k] > (M.stock[k] || 0);
    });
  });
  M.orders.forEach(function(o){
    o.warnSize = o.items.some(function(i){ return i._nosize; });
    o.warnShort = o.items.some(function(i){ return i._short; });
    o.noItems = o.items.length === 0 && o.stav !== 'storno' && o.stav !== 'smazano';
    o.problem = isOpen(o) && (o.warnSize || o.warnShort || o.noItems);
  });
  M.orders.sort(function(a,b){ return String(a.cas) < String(b.cas) ? 1 : -1; });
}
function isOpen(o){ return o.stav !== 'storno' && o.stav !== 'smazano' && !truthy(o.vydano); }

function parseSource(rows){
  var h = rows[0] || [];
  function col(name){ for (var i = 0; i < h.length; i++) if (String(h[i]).trim().indexOf(name) === 0) return i; return -1; }
  var c = { ts: col('Časová značka'), name: col('Jméno a příjmení'), kat: col('Kategorie'), typ: col('Typ setu'), extra: col('Volitelné položky'),
    pozn: col('Poznámka'), cena: col('Celková cena'), kis: col('KIS'), prip: col('Připraveno'), vyd: col('Vydáno') };
  var emailCols = []; h.forEach(function(x, i){ if (String(x).trim().indexOf('E-mail') === 0) emailCols.push(i); });
  var sizeIdx = {}; Object.keys(SIZECOL).forEach(function(it){ sizeIdx[it] = col(SIZECOL[it]); });
  var out = [];
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i] || [], name = String(c.name >= 0 ? r[c.name] || '' : '').trim();
    if (!name) continue;
    var email = ''; emailCols.forEach(function(ci){ if (!email && String(r[ci] || '').trim()) email = String(r[ci]).trim(); });
    var sizes = {}; Object.keys(sizeIdx).forEach(function(it){ var v = sizeIdx[it] >= 0 ? String(r[sizeIdx[it]] || '').trim().toUpperCase() : ''; sizes[it] = SIZES.indexOf(v) !== -1 ? v : ''; });
    out.push({ key: String(c.ts >= 0 ? r[c.ts] || '' : '').trim() + '|' + name, ts: String(r[c.ts] || '').trim(), name: name,
      kat: String(c.kat >= 0 ? r[c.kat] || '' : '').trim(), typ: String(c.typ >= 0 ? r[c.typ] || '' : '').trim(),
      extra: String(c.extra >= 0 ? r[c.extra] || '' : '').trim(), pozn: String(c.pozn >= 0 ? r[c.pozn] || '' : '').trim(),
      cena: String(c.cena >= 0 ? r[c.cena] || '' : ''), email: email, sizes: sizes,
      kis: truthy(c.kis >= 0 ? r[c.kis] : ''), prip: truthy(c.prip >= 0 ? r[c.prip] : ''), vyd: truthy(c.vyd >= 0 ? r[c.vyd] : '') });
  }
  return out;
}
function parseTs(s){ // "2.9.2026 21:33:34" -> ISO
  var m = String(s).match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return new Date().toISOString();
  return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +(m[6]||0)).toISOString();
}
function priceFromText(t){ var m = String(t).match(/(\d[\d\s]*)\s*Kč/); return m ? parseInt(m[1].replace(/\s/g,''), 10) || 0 : 0; }
function buildOrderFromSource(s){
  var typName = s.typ.replace(/\s+/g,' ').split(/ [–-] /)[0].trim();
  var items = [], oid = uid('o');
  function add(item, puvod){
    for (var i = 0; i < items.length; i++) if (items[i].item === item) { items[i].ks++; return; }
    items.push({ item: item, ks: 1, puvod: puvod });
  }
  if (M.sets[typName]) M.sets[typName].forEach(function(x){ for (var k = 0; k < x.ks; k++) add(x.item, 'set'); });
  else if (ITEMS.indexOf(typName) !== -1) add(typName, 'typ');
  s.extra.split(',').forEach(function(p){ var n = p.split(/ [–-] /)[0].trim(); if (n === 'Podzimní bunda') n = 'Šusťáková bunda'; if (ITEMS.indexOf(n) !== -1) add(n, 'extra'); });
  var cena = priceFromText(s.cena) || (priceFromText(s.typ) + s.extra.split(',').reduce(function(a,p){ return a + priceFromText(p); }, 0));
  var stav = s.vyd ? 'vydano' : (s.prip ? 'pripraveno' : 'nova');
  var order = { id: oid, zdroj_klic: s.key, cas: parseTs(s.ts), hrac: s.name, kategorie: s.kat, email: s.email, typ_setu: typName || s.typ, extra: s.extra,
    poznamka: s.pozn, cena: cena, kis: s.kis, pripraveno: s.prip || s.vyd, pripraveno_cas: '', pripraveno_kdo: (s.prip || s.vyd) ? 'převzato z původní tabulky' : '',
    vydano: s.vyd, vydano_cas: '', vydano_kdo: s.vyd ? 'převzato z původní tabulky' : '', poznamka_personal: '', stav: stav, upraveno: new Date().toISOString(),
    kis_zadano: s.kis, kis_zadano_cas: '', kis_zadano_kdo: s.kis ? 'převzato z původní tabulky' : '', kis_cas: '', kis_kdo: s.kis ? 'převzato z původní tabulky' : '' };
  var its = items.map(function(x){
    var sz = NOSIZE[x.item] ? '-' : (s.sizes[x.item] || '');
    return { id: uid('p'), order_id: oid, item: x.item, velikost: sz, ks: x.ks, vydano_ks: s.vyd ? x.ks : 0, puvod: x.puvod };
  });
  return { order: order, items: its };
}
function importSource(){
  var sid = M.settings.zdroj_spreadsheet_id, tab = M.settings.zdroj_list || 'Objednávky';
  if (!sid && !DEMO) return Promise.resolve(0);
  return B.readSource(sid, tab).then(function(rows){
    var parsed = parseSource(rows), known = {}; M.orders.forEach(function(o){ known[o.zdroj_klic] = 1; });
    var ign = (M.settings.ignorovat_jmena || '').split('|').map(function(x){ return x.trim().toLowerCase(); }).filter(Boolean);
    var no = [], ni = [];
    parsed.forEach(function(s){
      if (known[s.key] || ign.indexOf(s.name.toLowerCase()) !== -1) return;
      var b = buildOrderFromSource(s); no.push(toRow('Objednavky', b.order)); b.items.forEach(function(i){ ni.push(toRow('Polozky', i)); });
    });

  });
}

function fillTemplate(txt, o){
  return String(txt || '').split('[Jméno hráče]').join(o.hrac || '').split('[Jmeno hrace]').join(o.hrac || '')
    .split('[Kategorie]').join(o.kategorie || '').split('[Typ setu]').join(o.typ_setu || '')
    .split('[místo vyzvednutí]').join(M.settings.misto_vyzvednuti || '').split('[doplníme kde/kdy]').join(M.settings.misto_vyzvednuti || '');
}
function sendTemplate(key, o){
  var t = M.emails[key]; if (!t) return Promise.resolve(false);
  if (!o.email) { toast('Rodič nemá vyplněný e-mail – e-mail se neodeslal.', 'err'); return Promise.resolve(false); }
  return B.mail(o.email, fillTemplate(t.predmet, o), fillTemplate(t.text, o), M.settings.email_odesilatel || 'info@fkslovany.cz')
    .then(function(){ return true; }).catch(function(e){ toast('E-mail se nepodařilo odeslat: ' + e.message, 'err'); return false; });
}

function actKisZadano(o){
  var on = !o.kzB;
  if (!on && o.kisB) { toast('Nejdřív zrušte „Zaplaceno“.', 'err'); return Promise.resolve(); }
  return confirmBox(on ? 'Platba zadána do KIS?' : 'Zrušit zadání do KIS?', o.hrac + ' – ' + kc(o.cena), on ? 'Zadáno do KIS' : 'Zrušit').then(function(ok){
    if (!ok) return;
    var p = on ? { kis_zadano: true, kis_zadano_cas: new Date().toISOString(), kis_zadano_kdo: userEmail }
               : { kis_zadano: false, kis_zadano_cas: '', kis_zadano_kdo: '' };
    return save(B.update([orderUpdate(o, p)]), on ? 'Zadání do KIS zapsáno' : 'Zadání do KIS zrušeno');
  });
}
function actKis(o){
  var on = !o.kisB;
  return confirmBox(on ? 'Označit jako zaplaceno?' : 'Zrušit „zaplaceno“?', o.hrac + ' – ' + kc(o.cena), on ? 'Zaplaceno' : 'Zrušit').then(function(ok){
    if (!ok) return;
    var now = new Date().toISOString();
    var p = on ? { kis: true, kis_cas: now, kis_kdo: userEmail }
               : { kis: false, kis_cas: '', kis_kdo: '' };
    if (on && !o.kzB) { p.kis_zadano = true; p.kis_zadano_cas = now; p.kis_zadano_kdo = userEmail; }
    return save(B.update([orderUpdate(o, p)]), on ? 'Označeno jako zaplaceno' : 'Zaplacení zrušeno');
  });
}
function actPripraveno(o){
  var on = !o.prB;
  var msg = on ? (o.email ? 'Rodiči (' + o.email + ') se odešle e-mail, že je oblečení připravené.' : 'Rodič nemá e-mail, e-mail se neodešle.') : 'Označení se zruší, e-mail se neodesílá.';
  return confirmBox(on ? 'Označit jako připravené?' : 'Zrušit „připraveno“?', msg, on ? 'Připraveno' : 'Zrušit').then(function(ok){
    if (!ok) return;
    var p = on ? { pripraveno: true, pripraveno_cas: new Date().toISOString(), pripraveno_kdo: userEmail, stav: o.vyB ? 'vydano' : 'pripraveno' }
               : { pripraveno: false, pripraveno_cas: '', pripraveno_kdo: '', stav: o.vyB ? 'vydano' : 'nova' };
    return save(B.update([orderUpdate(o, p)]), on ? 'Označeno jako připravené' : 'Odznačeno').then(function(){ if (on) return sendTemplate('pripraveno', o); });
  });
}
function actVydat(o, itemIds){
  var sel = o.items.filter(function(i){ return itemIds.indexOf(i.id) !== -1 && i.ks - i.vydano_ks > 0; });
  if (!sel.length) { toast('Není vybraná žádná položka k vydání.', 'err'); return Promise.resolve(); }
  var bad = sel.filter(function(i){ return !validSize(i.item, i.velikost); });
  if (bad.length) { toast('Chybí velikost: ' + bad.map(function(i){ return i.item; }).join(', '), 'err'); return Promise.resolve(); }
  var short = sel.filter(function(i){ return (M.stock[i.item + '|' + i.velikost] || 0) < i.ks - i.vydano_ks; });
  if (short.length) { toast('Není skladem: ' + short.map(function(i){ return i.item + ' ' + i.velikost; }).join(', '), 'err'); return Promise.resolve(); }
  var willAll = o.items.every(function(i){ return i.ks - i.vydano_ks <= 0 || itemIds.indexOf(i.id) !== -1; });
  var warn = o.kisB ? '' : '\n⚠ Objednávka zatím není označena jako zaplacená.';
  var text = sel.map(function(i){ return (i.ks - i.vydano_ks) + '× ' + i.item + (NOSIZE[i.item] ? '' : ' ' + i.velikost); }).join(', ') + (willAll ? '\nObjednávka bude označena jako vydaná, rodiči se odešle e-mail.' : '\nČástečný výdej – objednávka zůstane otevřená.') + warn;
  return confirmBox('Vydat ' + o.hrac + '?', text, 'Vydat').then(function(ok){
    if (!ok) return;
    var ups = [], mv = [];
    sel.forEach(function(i){ var n = i.ks - i.vydano_ks; mv.push(moveRow('VYDEJ', i.item, i.velikost, -n, o.id, 'Výdej – ' + o.hrac)); ups.push(itemUpdate(i, { vydano_ks: i.ks })); });
    if (willAll) ups.push(orderUpdate(o, { vydano: true, vydano_cas: new Date().toISOString(), vydano_kdo: userEmail, stav: 'vydano', pripraveno: true }));
    return save(B.append('Pohyby', mv).then(function(){ return B.update(ups); }), willAll ? 'Vydáno' : 'Částečně vydáno').then(function(){ if (willAll) return sendTemplate('vydano', o); });
  });
}
function actVratit(o){
  var done = o.items.filter(function(i){ return i.vydano_ks > 0; });
  if (!done.length) return Promise.resolve();
  return confirmBox('Vrátit výdej?', 'Vydané kusy se vrátí na sklad a objednávka se znovu otevře. E-mail se neodesílá.', 'Vrátit').then(function(ok){
    if (!ok) return;
    var mv = [], ups = [];
    done.forEach(function(i){ if (validSize(i.item, i.velikost) && o.vydano_kdo !== 'převzato z původní tabulky') mv.push(moveRow('VRACENI', i.item, i.velikost, i.vydano_ks, o.id, 'Vrácení výdeje – ' + o.hrac)); ups.push(itemUpdate(i, { vydano_ks: 0 })); });
    ups.push(orderUpdate(o, { vydano: false, vydano_cas: '', vydano_kdo: '', stav: o.prB ? 'pripraveno' : 'nova' }));
    return save(B.append('Pohyby', mv).then(function(){ return B.update(ups); }), 'Výdej vrácen');
  });
}
function actStorno(o){
  var on = o.stav !== 'storno';
  return confirmBox(on ? 'Stornovat objednávku?' : 'Obnovit objednávku?', on ? 'Rezervace se uvolní. Už vydané kusy zůstávají vydané.' : 'Objednávka se znovu otevře.', on ? 'Stornovat' : 'Obnovit').then(function(ok){
    if (!ok) return; return save(B.update([orderUpdate(o, { stav: on ? 'storno' : (o.vyB ? 'vydano' : (o.prB ? 'pripraveno' : 'nova')) })]), on ? 'Stornováno' : 'Obnoveno');
  });
}
function actSmazat(o){
  var done = o.items.filter(function(i){ return i.vydano_ks > 0; });
  var back = done.filter(function(i){ return validSize(i.item, i.velikost) && o.vydano_kdo !== 'převzato z původní tabulky'; });
  var txt = 'Objednávka se přesune do složky „Vymazáno“ a půjde obnovit.' +
    (back.length ? '\nVydané kusy se vrátí na sklad: ' + back.map(function(i){ return i.vydano_ks + '× ' + i.item + (NOSIZE[i.item] ? '' : ' ' + i.velikost); }).join(', ') + '.' : '');
  return confirmBox('Vymazat objednávku?', o.hrac + ' – ' + kc(o.cena) + '\n' + txt, 'Vymazat').then(function(ok){
    if (!ok) return;
    var mv = back.map(function(i){ return moveRow('VRACENI', i.item, i.velikost, i.vydano_ks, o.id, 'Vymazání objednávky – ' + o.hrac); });
    var ups = done.map(function(i){ return itemUpdate(i, { vydano_ks: 0 }); });
    ups.push(orderUpdate(o, { stav: 'smazano', vydano: false, vydano_cas: '', vydano_kdo: '' }));
    closeSheet();
    return save(B.append('Pohyby', mv).then(function(){ return B.update(ups); }), 'Objednávka je ve složce „Vymazáno“');
  });
}
function actObnovitSmazano(o){
  return confirmBox('Obnovit objednávku?', o.hrac + ' se vrátí mezi aktivní objednávky. Sklad se nemění.', 'Obnovit').then(function(ok){
    if (!ok) return;
    closeSheet();
    return save(B.update([orderUpdate(o, { stav: o.prB ? 'pripraveno' : 'nova' })]), 'Objednávka obnovena');
  });
}
function actSize(o, itemId, sz){
  var it = o.items.filter(function(i){ return i.id === itemId; })[0]; if (!it) return;
  return save(B.update([itemUpdate(it, { velikost: sz })]));
}
function actNote(o, txt){ return save(B.update([orderUpdate(o, { poznamka_personal: txt })]), 'Poznámka uložena'); }

/* ================================ UI ===================================== */
function confirmBox(title, text, okLabel){
  return new Promise(function(res){
    var host = document.getElementById('ovHost'), d = document.createElement('div');
    d.className = 'ov'; d.style.zIndex = 70; d.style.alignItems = 'center'; d.style.padding = '20px';
    d.innerHTML = '<div class="card" style="max-width:420px;width:100%;margin:0"><h3 style="margin:0 0 8px">' + esc(title) + '</h3><div class="muted" style="white-space:pre-line;margin-bottom:16px">' + esc(text) + '</div>' +
      '<div class="row"><button class="btn" data-no>Zpět</button><button class="btn pri" data-yes>' + esc(okLabel || 'OK') + '</button></div></div>';
    host.appendChild(d);
    function close(v){ d.remove(); res(v); }
    d.querySelector('[data-no]').onclick = function(){ close(false); };
    d.querySelector('[data-yes]').onclick = function(){ close(true); };
    d.onclick = function(e){ if (e.target === d) close(false); };
  });
}
function openSheet(html){ var h = document.getElementById('ovHost'); var ex = h.querySelector('.ov.main'); if (ex) { ex.querySelector('.sheet').innerHTML = '<div class="grab"></div>' + html; return; }
  var d = document.createElement('div'); d.className = 'ov main'; d.innerHTML = '<div class="sheet"><div class="grab"></div>' + html + '</div>';
  d.onclick = function(e){ if (e.target === d) closeSheet(); }; h.appendChild(d); }
function closeSheet(fromPop){
  var ex = document.querySelector('#ovHost .ov.main'); if (ex) ex.remove(); UI.openOrder = null;
  if (UI.sheetPushed) { UI.sheetPushed = false; if (fromPop !== true) { UI.ignorePop = true; try { history.back(); } catch (e) { UI.ignorePop = false; } } }
}
function pushNav(state){ try { history.pushState(state, ''); } catch (e) {} }
// Tlačítko Zpět: nejdřív zavře otevřený detail, potom vrací mezi záložkami (místo opuštění aplikace)
window.addEventListener('popstate', function(e){
  if (UI.ignorePop) { UI.ignorePop = false; return; }
  if (document.querySelector('#ovHost .ov:not(.main)')) { pushNav({ tab: UI.tab }); return; }   // otevřený potvrzovací dialog – zůstat
  if (document.querySelector('#ovHost .ov.main')) { closeSheet(true); return; }
  var st = e.state;
  if (st && st.tab && st.tab !== UI.tab) { UI.tab = st.tab; UI.q = ''; renderAll(); window.scrollTo(0, 0); }
});

function isAdmin(){ return role === 'admin'; }
function countOpenProblems(){ return M.orders ? M.orders.filter(function(o){ return o.problem; }).length : 0; }
function lowList(){
  var out = [];
  ITEMS.forEach(function(it){ ALLSIZES.forEach(function(sz){
    var mn = M.min[it + '|' + sz] || 0, f = freeOf(it, sz);
    if (mn > 0 && f < mn) out.push({ item: it, size: sz, free: f, min: mn, need: mn - f });
  }); });
  return out;
}

function renderTop(){
  var el = document.getElementById('top'); if (!el) return;
  var b = el.querySelector('[data-act=refresh]'); if (b) b.classList.toggle('spin', !!UI.busy);
}
function shell(){
  return '<div id="app"><header class="top" id="top"><img src="logo.png" alt=""><div class="t">Sklad oblečení<small>' + esc(DEMO ? 'DEMO režim' : 'FK Slovany Pardubice') + '</small></div><div class="sp"></div>' +
    '<button class="ibtn" data-act="refresh" title="Obnovit">' + ICON.refresh + '</button><button class="ibtn" data-act="signout" title="Odhlásit">' + ICON.out2 + '</button></header>' +
    '<main id="main"></main></div><nav class="bottom"><div class="in" id="nav"></div></nav>';
}
function renderNav(){
  var tabs = [['orders','Objednávky',ICON.list],['vydej','Výdej',ICON.out],['sklad','Sklad',ICON.box],['prijem','Příjem',ICON.in]];
  if (isAdmin()) tabs.push(['settings','Nastavení',ICON.cog]);
  var low = M.loaded && !M.needSetup ? lowList().length : 0, pr = M.loaded && !M.needSetup ? countOpenProblems() : 0;
  document.getElementById('nav').innerHTML = tabs.map(function(t){
    var badge = t[0] === 'sklad' && low ? '<span class="dot" style="background:var(--amber);color:#1a1200">' + low + '</span>' : (t[0] === 'orders' && pr ? '<span class="dot">' + pr + '</span>' : '');
    return '<button data-act="tab" data-tab="' + t[0] + '" class="' + (UI.tab === t[0] ? 'on' : '') + '">' + t[2] + t[1] + badge + '</button>';
  }).join('');
}
function renderAll(){
  var main = document.getElementById('main'); if (!main) return;
  renderNav(); renderTop();
  if (!M.loaded) { main.innerHTML = '<div class="empty">Načítám…</div>'; return; }
  if (M.needSetup) { main.innerHTML = setupView(); return; }
  var v = { orders: ordersView, vydej: vydejView, sklad: skladView, prijem: prijemView, settings: settingsView }[UI.tab] || ordersView;
  var scroll = window.scrollY, active = document.activeElement, keep = active && active.id === 'q' ? active.selectionStart : null;
  main.innerHTML = v();
  var q = document.getElementById('q'); if (q && keep !== null) { q.focus(); try { q.setSelectionRange(keep, keep); } catch(e){} }
  if (UI.openOrder) renderOrderSheet();
}
function setupView(){
  if (!isAdmin()) return '<div class="empty">Databáze ještě není připravená.<br>Požádejte administrátora, ať aplikaci jednou otevře.</div>';
  return '<div class="card"><h2>Prvotní nastavení</h2><p class="muted">Databáze (Google tabulka) je zatím prázdná. Tlačítkem vytvoříte potřebné listy a nahrajete počáteční stav skladu, minima, katalog, sety a šablony e-mailů.</p><button class="btn pri blk" data-act="setup">Připravit databázi</button></div>';
}

/* ---------- Objednávky ---------- */
function orderState(o){ return o.stav === 'smazano' ? 'smazano' : (o.stav === 'storno' ? 'storno' : (o.vyB ? 'vydano' : (o.prB ? 'pripraveno' : 'nova'))); }
function filterOrders(){
  var f = UI.filter, q = norm(UI.q);
  return M.orders.filter(function(o){
    if (q && norm(o.hrac + ' ' + o.kategorie + ' ' + o.email).indexOf(q) === -1) return false;
    var open = isOpen(o);
    switch (f) {
      case 'open': return open;
      case 'kzad': return open && !o.kzB;
      case 'pay': return open && o.kzB && !o.kisB;
      case 'prep': return open && o.kisB && !o.prB;
      case 'ready': return open && o.prB;
      case 'problem': return o.problem;
      case 'done': return o.vyB && o.stav !== 'storno' && o.stav !== 'smazano';
      case 'del': return o.stav === 'smazano';
      default: return o.stav !== 'smazano';
    }
  });
}
function ordersView(){
  var cnt = function(fn){ return M.orders.filter(fn).length; };
  var chips = [['open','K vyřízení',cnt(isOpen)],['kzad','Zadat do KIS',cnt(function(o){return isOpen(o)&&!o.kzB;})],['pay','Čeká na platbu',cnt(function(o){return isOpen(o)&&o.kzB&&!o.kisB;})],['prep','K přípravě',cnt(function(o){return isOpen(o)&&o.kisB&&!o.prB;})],
    ['ready','Připraveno',cnt(function(o){return isOpen(o)&&o.prB;})],['problem','Problémy',countOpenProblems()],['done','Vydáno',cnt(function(o){return o.vyB&&o.stav!=='storno'&&o.stav!=='smazano';})],['all','Vše',cnt(function(o){return o.stav!=='smazano';})],['del','Vymazáno',cnt(function(o){return o.stav==='smazano';})]];
  var list = filterOrders();
  return '<div class="search">' + ICON.search + '<input id="q" type="search" placeholder="Hledat hráče…" value="' + esc(UI.q) + '" data-input="q"></div>' +
    '<div class="chips">' + chips.map(function(c){ return '<button class="chip ' + (UI.filter === c[0] ? 'on' : '') + '" data-act="filter" data-f="' + c[0] + '">' + c[1] + '<span class="n">' + c[2] + '</span></button>'; }).join('') + '</div>' +
    (UI.importInfo ? '<div class="mini" style="margin-bottom:8px">' + esc(UI.importInfo) + '</div>' : '') +
    (list.length ? list.map(orderCard).join('') : '<div class="empty">Žádné objednávky.</div>');
}
function orderCard(o){
  var st = orderState(o), bs = [];
  bs.push(o.kisB ? '<span class="b ok">✓ Zaplaceno</span>' : (o.kzB ? '<span class="b acc">V KIS – čeká na platbu</span>' : '<span class="b warn">Zadat do KIS</span>'));
  if (st === 'smazano') bs.push('<span class="b bad">Vymazáno</span>');
  else if (st === 'storno') bs.push('<span class="b bad">Storno</span>');
  else { bs.push('<span class="b ' + (o.prB ? 'acc' : '') + '">' + (o.prB ? '✓ Připraveno' : 'Nepřipraveno') + '</span>'); if (o.vyB) bs.push('<span class="b ok">✓ Vydáno</span>'); }
  if (o.warnSize) bs.push('<span class="b bad">Chybí velikost</span>');
  if (o.warnShort) bs.push('<span class="b bad">Chybí na skladě</span>');
  if (o.noItems) bs.push('<span class="b bad">Neznámý set</span>');
  var partial = o.items.some(function(i){ return i.vydano_ks > 0; }) && !o.vyB; if (partial) bs.push('<span class="b warn">Částečně vydáno</span>');
  return '<button class="ord s-' + st + '" data-act="open" data-id="' + esc(o.id) + '"><div class="r1"><span class="nm">' + esc(o.hrac) + '</span><span class="pr">' + kc(o.cena) + '</span></div>' +
    '<div class="r2">' + esc(o.typ_setu) + (o.extra ? ' + ' + esc(o.extra.replace(/\s*[–-]\s*\d[\d\s]*Kč/g, '')) : '') + (o.kategorie ? ' · ' + esc(o.kategorie) : '') + ' · ' + fmtD(o.cas) + '</div><div class="badges">' + bs.join('') + '</div></button>';
}
function renderOrderSheet(){
  var o = M.orders.filter(function(x){ return x.id === UI.openOrder; })[0]; if (!o) { closeSheet(); return; }
  var open = isOpen(o), anyRem = o.items.some(function(i){ return i.ks - i.vydano_ks > 0; }), anyDone = o.items.some(function(i){ return i.vydano_ks > 0; });
  var its = o.items.map(function(i){
    var rem = i.ks - i.vydano_ks, chip;
    if (rem <= 0) chip = '<span class="b ok">Vydáno</span>';
    else if (i._nosize) chip = '<span class="b bad">Chybí velikost</span>';
    else if (i._short) chip = '<span class="b bad">Chybí</span>';
    else chip = '<span class="b ok">Skladem</span>';
    var sel = NOSIZE[i.item] ? '<span class="muted">–</span>' : '<select class="in" data-change="size" data-iid="' + esc(i.id) + '"' + (rem <= 0 ? ' disabled' : '') + '><option value="">?</option>' +
      SIZES.map(function(s){ return '<option' + (s === i.velikost ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>';
    var canPick = rem > 0 && o.stav !== 'storno' && o.stav !== 'smazano';
    return '<div class="it"><input type="checkbox" data-pick value="' + esc(i.id) + '"' + (canPick ? ' checked' : ' disabled') + '><div><div class="nm">' + (i.ks > 1 ? i.ks + '× ' : '') + esc(i.item) + '</div><div class="sub">' + chip + (i.puvod === 'extra' ? ' <span class="mini">navíc</span>' : '') + '</div></div>' + sel + '</div>';
  }).join('');
  openSheet('<h3>' + esc(o.hrac) + '</h3><div class="mini">' + esc(o.kategorie) + ' · ' + fmtDT(o.cas) + '</div>' +
    '<div class="card" style="margin-top:12px"><div class="kv"><span class="muted">Objednávka</span><span>' + esc(o.typ_setu) + '</span></div>' +
    (o.extra ? '<div class="kv"><span class="muted">Navíc</span><span style="text-align:right">' + esc(o.extra) + '</span></div>' : '') +
    '<div class="kv"><span class="muted">Cena</span><b>' + kc(o.cena) + '</b></div><div class="kv"><span class="muted">E-mail</span><span>' + (o.email ? '<a style="color:var(--accent)" href="mailto:' + esc(o.email) + '">' + esc(o.email) + '</a>' : '<span class="neg">chybí</span>') + '</span></div>' +
    (o.poznamka ? '<div class="kv"><span class="muted">Poznámka</span><span style="text-align:right">' + esc(o.poznamka) + '</span></div>' : '') + '</div>' +

/* =============================== PŘIHLÁŠENÍ ============================== */
var tokenClient = null, LAST_KEY = 'sklad_last_email';
function gisReady(){ return window.google && google.accounts && google.accounts.oauth2; }
function showLogin(msg){
  document.getElementById('root').innerHTML = '<div class="login"><img src="logo.png" alt=""><h2 style="margin:0">Sklad oblečení</h2><div class="muted">FK Slovany Pardubice</div>' +
    '<button class="btn pri" id="siBtn" style="min-width:240px">Přihlásit se přes Google</button><div class="err" id="siErr">' + esc(msg || '') + '</div></div>';
  document.getElementById('siBtn').onclick = signIn;
}
function ensureClient(){
  if (tokenClient) return tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CONFIG.CLIENT_ID, scope: CONFIG.SCOPES, callback: function(resp){
    if (resp.error) { var e = document.getElementById('siErr'); if (e) e.textContent = 'Přihlášení selhalo: ' + resp.error; return; }
    token = resp.access_token; afterSignIn();
  } });
  return tokenClient;
}
function signIn(){
  if (!gisReady()) { var e = document.getElementById('siErr'); if (e) e.textContent = 'Google přihlášení se ještě načítá, zkuste to za chvíli.'; return; }
  ensureClient().requestAccessToken({ prompt: 'select_account' });
}
function trySilent(){
  var saved = null; try { saved = localStorage.getItem(LAST_KEY); } catch (e) {}
  if (!saved) return;
  var n = 0; (function attempt(){
    if (gisReady()) {
      ensureClient().requestAccessToken({ prompt: '', hint: saved });
    } else if (++n < 30) setTimeout(attempt, 200);
  })();
}
function signOut(){
  if (DEMO) { location.href = location.pathname; return; }
  try { if (token && gisReady()) google.accounts.oauth2.revoke(token, function(){}); } catch (e) {}
  token = null; try { localStorage.removeItem(LAST_KEY); } catch (e) {} showLogin();
}
function afterSignIn(){
  document.getElementById('root').innerHTML = '<div class="empty">Ověřuji přístup…</div>';
  fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } }).then(function(r){ return r.json(); }).then(function(u){
    userEmail = (u.email || '').toLowerCase();
    role = CONFIG.ADMIN_EMAILS.indexOf(userEmail) !== -1 ? 'admin' : (CONFIG.STAFF_EMAILS.indexOf(userEmail) !== -1 ? 'staff' : null);
    if (!role) { document.getElementById('root').innerHTML = '<div class="login"><img src="logo.png" alt=""><h3>Přístup odepřen</h3><div class="muted">Účet ' + esc(userEmail) + ' nemá k aplikaci přístup.</div><button class="btn" id="so">Odhlásit</button></div>'; document.getElementById('so').onclick = signOut; return; }
    try { localStorage.setItem(LAST_KEY, userEmail); } catch (e) {}
    start();
  }).catch(function(e){ showLogin('Nepodařilo se ověřit účet: ' + e.message); });
}
function start(){
  try { history.replaceState({ tab: UI.tab }, ''); } catch (e) {}
  document.getElementById('root').innerHTML = shell(); renderAll(); refresh();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && M.loaded && !UI.busy && Date.now() - (UI.last || 0) > 60000) { UI.last = Date.now(); refresh(); } });
  UI.last = Date.now();
}
(function boot(){
  if (DEMO) { DemoB.init(); userEmail = 'demo@demo'; role = /[?&]role=staff/.test(location.search) ? 'staff' : 'admin'; start(); return; }
  showLogin(); trySilent();
})();
</script>
